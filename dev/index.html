<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Engineer Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.15.1/devicon.min.css">
    <style>
        /* === CSS Reset === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* === Variables === */
        :root {
            --primary-color: #2ecc71;  /* AI-themed green */
            --dark-bg: #1a1a1a;
            --text-light: #ffffff;
        }

        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            background-color: var(--dark-bg);
            color: var(--text-light);
        }

        /* === Hero Section === */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto 2rem;
        }

        .cta-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .btn {
            padding: 1rem 2rem;
            border-radius: 5px;
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        /* === Projects Section === */
        .projects {
            padding: 4rem 2rem;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .project-card {
            background: #2a2a2a;
            padding: 1.5rem;
            border-radius: 10px;
            transition: transform 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-5px);
        }

        .tech-stack {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin: 1rem 0;
        }

        .tech-icon {
            font-size: 2rem;
        }

        /* === Skills Section === */
        .skills {
            padding: 4rem 2rem;
            text-align: center;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 2rem auto;
        }

        /* === Contact Section === */
        .contact {
            padding: 4rem 2rem;
            text-align: center;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
        }

        .social-icon {
            font-size: 2.5rem;
            color: var(--text-light);
            transition: color 0.3s ease;
        }

        /* === Responsive Design === */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>AI Engineer | NLP & Computer Vision</h1>
            <p>Building intelligent systems with Python, PyTorch, and deep learning</p>
            <div class="cta-buttons">
                <a href="#projects" class="btn btn-primary">View Projects</a>
                <a href="#" class="btn">Download CV</a>
            </div>
        </div>
    </section>

    <!-- Projects Section -->
    <section id="projects" class="projects">
        <h2>Featured Projects</h2>
        <div class="projects-grid">
            <!-- Project 1 -->
            <div class="project-card">
                <h3>Text Classification System</h3>
                <div class="tech-stack">
                    <i class="devicon-python-plain tech-icon"></i>
                    <i class="devicon-pytorch-plain tech-icon"></i>
                </div>
                <p>Transformer-based model achieving 92% accuracy on sentiment analysis</p>
                <a href="#" class="btn">GitHub</a>
            </div>

            <!-- Add more project cards -->
        </div>
    </section>

    <!-- Skills Section -->
    <section class="skills">
        <h2>Technical Skills</h2>
        <div class="skills-grid">
            <div class="skill-item">
                <i class="devicon-python-plain tech-icon"></i>
                <p>Python</p>
            </div>
            <!-- Add more skills -->
        </div>
    </section>

    <!-- Contact Section -->
    <section class="contact">
        <h2>Get in Touch</h2>
        <div class="social-links">
            <a href="#"><i class="fab fa-github social-icon"></i></a>
            <a href="#"><i class="fab fa-linkedin social-icon"></i></a>
        </div>
    </section>

    <script>
        // Smooth scrolling for navigation
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });

        // Simple fade-in animation on scroll
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = 1;
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        });

        // Observe all project cards
        document.querySelectorAll('.project-card').forEach((card) => {
            card.style.opacity = 0;
            card.style.transform = 'translateY(20px)';
            observer.observe(card);
        });
    </script>
</body>
</html>
